name: Daily Market Closing Price Update

on:
  schedule:
    # 18:00 น. เวลาไทย (UTC+7) = 11:00 UTC ทุกวัน
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Market Data Scraper
        run: |
          python update_market_data.py

      - name: Commit and Push Updated Market Data
        run: |
          git config --global user.name "FinTrack Market Bot"
          git config --global user.email "bot@fintrack.app"
          git add market_data.json
          git commit -m "Auto-update market closing prices: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes to commit"
          git push
